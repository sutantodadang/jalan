name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: zig build test
      - run: zig build
      - name: jalan lints its own workflow
        run: ./zig-out/bin/jalan lint .github/workflows/ci.yml
        if: runner.os != 'Windows'
      - name: jalan lints its own workflow (windows)
        run: ./zig-out/bin/jalan.exe lint .github/workflows/ci.yml
        if: runner.os == 'Windows'
      - name: docker backend integration
        run: ./zig-out/bin/jalan run --backend docker testdata/workflows/docker.yml
        if: runner.os == 'Linux'
      - name: phase 3 docker parity
        run: zig test src/root.zig --test-filter "phase 3 docker"
        if: runner.os == 'Linux'
      - name: install nix
        uses: cachix/install-nix-action@v27
        if: runner.os == 'Linux'
      - name: nix backend integration
        run: ./zig-out/bin/jalan run --backend nix testdata/workflows/basic.yml
        if: runner.os == 'Linux'
